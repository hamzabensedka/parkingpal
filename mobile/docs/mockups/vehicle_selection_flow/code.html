<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vehicle Selection - ParkingPal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec63",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102217",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111813] dark:text-white transition-colors duration-300">
<div class="relative flex min-h-screen w-full max-w-[430px] mx-auto flex-col bg-white dark:bg-background-dark overflow-x-hidden shadow-xl">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-[#f0f4f2] dark:border-white/10">
<div class="text-[#111813] dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Vehicle Selection</h2>
<div class="size-12"></div> <!-- Spacer for centering -->
</div>
<div class="flex flex-col flex-1">
<!-- HeadlineText -->
<div class="px-4 pt-8 pb-4">
<h2 class="text-[#111813] dark:text-white tracking-light text-[28px] font-bold leading-tight text-left">Which vehicle are you parking?</h2>
<p class="text-[#618970] dark:text-primary/70 text-base mt-2">Select the vehicle you'll be using for this booking.</p>
</div>
<!-- List Items Container -->
<div class="flex flex-col gap-1 mt-4">
<!-- Vehicle 1 (Selected) -->
<div class="flex items-center gap-4 bg-white dark:bg-background-dark px-4 min-h-[80px] py-3 justify-between hover:bg-background-light dark:hover:bg-white/5 transition-colors cursor-pointer">
<div class="flex items-center gap-4">
<div class="text-[#111813] dark:text-white flex items-center justify-center rounded-xl bg-[#f0f4f2] dark:bg-white/10 shrink-0 size-14">
<span class="material-symbols-outlined text-2xl">directions_car</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#111813] dark:text-white text-base font-semibold leading-normal line-clamp-1">Tesla Model 3</p>
<p class="text-[#618970] dark:text-primary/70 text-sm font-medium leading-normal line-clamp-2">AB-123-CD</p>
</div>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-primary p-0.5 justify-end">
<div class="h-full w-[27px] rounded-full bg-white shadow-md"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<!-- Vehicle 2 -->
<div class="flex items-center gap-4 bg-white dark:bg-background-dark px-4 min-h-[80px] py-3 justify-between hover:bg-background-light dark:hover:bg-white/5 transition-colors cursor-pointer border-t border-[#f0f4f2] dark:border-white/5">
<div class="flex items-center gap-4">
<div class="text-[#111813] dark:text-white flex items-center justify-center rounded-xl bg-[#f0f4f2] dark:bg-white/10 shrink-0 size-14">
<span class="material-symbols-outlined text-2xl">electric_car</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#111813] dark:text-white text-base font-semibold leading-normal line-clamp-1">Ford F-150</p>
<p class="text-[#618970] dark:text-primary/70 text-sm font-medium leading-normal line-clamp-2">XY-987-ZZ</p>
</div>
</div>
<div class="shrink-0">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded-md border-[#dbe6df] dark:border-white/20 border-2 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:outline-none" type="checkbox"/>
</div>
</div>
</div>
</div>
<!-- SingleButton (Add New) -->
<div class="px-4 py-8">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-[#f0f4f2] dark:bg-white/10 text-[#111813] dark:text-white gap-2 transition-all hover:bg-primary/20">
<span class="material-symbols-outlined">add</span>
<span class="truncate text-base font-bold leading-normal tracking-[0.015em]">Add New Vehicle</span>
</button>
</div>
</div>
<!-- Footer Button (Confirm) -->
<div class="p-4 border-t border-[#f0f4f2] dark:border-white/10 bg-white dark:bg-background-dark mb-4">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-background-dark text-base font-extrabold shadow-lg shadow-primary/20 transition-transform active:scale-95">
                Confirm Selection
            </button>
</div>
</div>
</body></html>
