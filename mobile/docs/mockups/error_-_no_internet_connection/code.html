<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec37",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Error - No Internet Connection</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-gray-900 dark:text-white flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</div>
<div class="flex-grow text-center pr-12">
<p class="text-gray-900 dark:text-white font-semibold">Connection Error</p>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-grow flex flex-col justify-center items-center px-6">
<!-- EmptyState Variant -->
<div class="flex flex-col items-center gap-8 w-full">
<!-- Illustration Placeholder -->
<div class="relative flex items-center justify-center w-full max-w-[280px] aspect-square rounded-full bg-primary/10 dark:bg-primary/5">
<div class="absolute inset-0 flex items-center justify-center opacity-20">
<span class="material-symbols-outlined text-[160px] text-primary">cloud_off</span>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="bg-white dark:bg-gray-800 p-8 rounded-full shadow-lg border border-primary/20">
<span class="material-symbols-outlined text-7xl text-primary" style="font-variation-settings: 'FILL' 1">wifi_off</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="flex max-w-[480px] flex-col items-center gap-3">
<h1 class="text-gray-900 dark:text-white text-2xl font-bold leading-tight tracking-[-0.015em] text-center">
                        You're Offline
                    </h1>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-relaxed max-w-[280px] text-center">
                        Check your connection and try again to browse available parking spots.
                    </p>
</div>
<!-- Primary Action -->
<button class="flex w-full max-w-[320px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary text-gray-900 text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 hover:scale-[0.98] transition-transform">
<span class="truncate">Retry</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<div class="flex gap-2 border-t border-gray-200 dark:border-gray-800 bg-background-light dark:bg-background-dark px-4 pb-8 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center" data-icon="MagnifyingGlass">
<span class="material-symbols-outlined">search</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Find</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center" data-icon="MapPin">
<span class="material-symbols-outlined">map</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">My Spots</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center" data-icon="Calendar">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Bookings</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center" data-icon="User">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</div>
</div>
</body></html>
