<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkingPal - No Results</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-10 bg-white dark:bg-background-dark border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<div class="text-gray-900 dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Search Results</h2>
<div class="size-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content: Empty State -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12 max-w-md mx-auto w-full">
<div class="flex flex-col items-center gap-8 w-full">
<!-- Illustration Area -->
<div class="relative w-full aspect-square max-w-[280px] bg-gray-50 dark:bg-gray-900/50 rounded-full flex items-center justify-center overflow-hidden">
<!-- Abstract Map Pattern Background -->
<div class="absolute inset-0 opacity-10 dark:opacity-20 bg-[radial-gradient(#13ec5b_1px,transparent_1px)] [background-size:20px_20px]" data-location="San Francisco" style=""></div>
<!-- Main Illustration (SVG for clean modern look) -->
<div class="relative z-10 flex flex-col items-center">
<div class="bg-primary/20 p-8 rounded-full">
<span class="material-symbols-outlined text-primary text-8xl">search_off</span>
</div>
</div>
<!-- Decorative Elements -->
<div class="absolute top-10 right-10 bg-primary/30 size-4 rounded-full"></div>
<div class="absolute bottom-12 left-8 bg-primary/20 size-6 rounded-full"></div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-3 text-center">
<h1 class="text-gray-900 dark:text-white text-2xl font-bold leading-tight tracking-[-0.015em]">
                    No spots found in this area
                </h1>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-relaxed max-w-[320px]">
                    Try broadening your filters or searching in a different location to see more results nearby.
                </p>
</div>
<!-- Action Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary text-gray-900 text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 hover:brightness-105 active:scale-95 transition-all">
<span class="truncate">Clear All Filters</span>
</button>
<button class="text-gray-600 dark:text-gray-400 text-sm font-semibold py-2">
                Show map anyway
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<footer class="sticky bottom-0 bg-white dark:bg-background-dark border-t border-gray-100 dark:border-gray-800 pb-8 pt-2">
<div class="flex gap-2 px-4 max-w-md mx-auto">
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined fill-icon text-2xl">search</span>
</div>
<p class="text-[10px] font-bold uppercase tracking-wider">Search</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-2xl">calendar_today</span>
</div>
<p class="text-[10px] font-bold uppercase tracking-wider">Bookings</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-2xl">chat_bubble</span>
</div>
<p class="text-[10px] font-bold uppercase tracking-wider">Messages</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined text-2xl">account_circle</span>
</div>
<p class="text-[10px] font-bold uppercase tracking-wider">Profile</p>
</a>
</div>
</footer>
</body></html>
