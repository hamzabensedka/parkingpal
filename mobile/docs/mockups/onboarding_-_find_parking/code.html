<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkingPal Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-full min-h-screen w-full flex-col justify-between overflow-hidden bg-background-light dark:bg-background-dark transition-colors duration-200">
<!-- Main Content Area -->
<div class="flex flex-1 flex-col items-center pt-8">
<!-- Illustration Area -->
<div class="@container w-full max-w-md px-4 py-6">
<div class="relative w-full aspect-[4/5] bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl shadow-lg" data-alt="hand holding smartphone showing map with parking pins" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCFOfAKwjEF4jMWtItNjp_P_iqZGuq4ceHjNaqWCN6g12lKr-Hf3WeCWHVp_LiwB8Tt0-a1l1FqPybDcXylRg5C35N3i7TNx5s858HdWGUsRTg9JE9oqfj5XXbcQk74N_Z4MhPUxmPXiWFh4foyBkKoP8KXGd9ulLp4xOf_x6DhCXKNGjIxeeixPGxPZafDJXW_A6ghAXxSooN499WwWtlb0-69PV6AvSk34Fb7w9nWarBwgG9VrXFDaWPDdNnn0FcGQ9Cs63vyoHSm");'>
<!-- Overlay Gradient for better text readability if needed later, or just aesthetic -->
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center px-6 text-center max-w-md">
<h1 class="text-[#111418] dark:text-white tracking-tight text-[32px] font-bold leading-tight pb-3 pt-4">
                    Find parking in seconds
                </h1>
<p class="text-[#637588] dark:text-[#9ba8b8] text-base font-normal leading-normal pb-6">
                    See real-time available spots near your destination without the hassle.
                </p>
</div>
</div>
<!-- Bottom Actions Area -->
<div class="w-full max-w-md mx-auto pb-8 pt-4 bg-background-light dark:bg-background-dark">
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5">
<div class="h-2 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-2 w-2 rounded-full bg-[#dbe0e6] dark:bg-[#3b4754]"></div>
<div class="h-2 w-2 rounded-full bg-[#dbe0e6] dark:bg-[#3b4754]"></div>
</div>
<!-- Action Button -->
<div class="flex px-4">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-primary/90 active:scale-95 transition-all text-white text-lg font-bold leading-normal tracking-[0.015em] shadow-md shadow-primary/20">
<span class="truncate">Next</span>
<span class="material-symbols-outlined ml-2 text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Skip Link -->
<div class="flex justify-center pt-4">
<button class="text-[#637588] dark:text-[#9ba8b8] text-sm font-medium hover:text-primary dark:hover:text-primary transition-colors">
                    Skip
                </button>
</div>
</div>
</div>
