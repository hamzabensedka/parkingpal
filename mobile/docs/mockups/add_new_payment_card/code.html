<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec6d",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102218",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col bg-white dark:bg-background-dark shadow-xl">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-[#111814] dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#111814] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Add New Payment Card</h2>
</div>
<div class="px-4 py-2">
<!-- Visual Card Mockup -->
<div class="w-full h-48 rounded-xl bg-gradient-to-br from-[#13ec6d] to-[#0b9c48] p-6 text-white flex flex-col justify-between shadow-lg mb-6">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-4xl">contactless</span>
<div class="w-12 h-8 bg-white/20 rounded"></div>
</div>
<div class="space-y-4">
<div class="text-xl tracking-[0.2em] font-medium opacity-50">•••• •••• •••• ••••</div>
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="text-[10px] uppercase opacity-70">Card Holder</span>
<span class="text-sm font-medium tracking-wide">YOUR NAME</span>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] uppercase opacity-70">Expires</span>
<span class="text-sm font-medium tracking-wide">MM/YY</span>
</div>
</div>
</div>
</div>
<!-- Headline -->
<h3 class="text-[#111814] dark:text-white tracking-light text-2xl font-bold leading-tight pb-2 pt-2">Payment Details</h3>
<p class="text-[#618972] dark:text-gray-400 text-sm mb-4">Securely add your payment method for faster parking bookings.</p>
<!-- Form Fields -->
<div class="space-y-4">
<!-- Cardholder Name -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col w-full">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">Cardholder Name</p>
<input class="form-input flex w-full rounded-xl text-[#111814] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-[#dbe6e0] dark:border-gray-700 bg-white dark:bg-background-dark h-14 placeholder:text-[#618972] p-[15px] text-base font-normal" placeholder="e.g. John Doe" value=""/>
</label>
</div>
<!-- Card Number -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col w-full">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">Card Number</p>
<div class="flex w-full items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl rounded-r-none border-r-0 text-[#111814] dark:text-white focus:outline-0 focus:ring-0 border border-[#dbe6e0] dark:border-gray-700 bg-white dark:bg-background-dark h-14 placeholder:text-[#618972] p-[15px] text-base font-normal" placeholder="0000 0000 0000 0000" value=""/>
<div class="text-[#618972] flex border border-[#dbe6e0] dark:border-gray-700 bg-white dark:bg-background-dark items-center justify-center pr-[15px] rounded-r-xl border-l-0">
<span class="material-symbols-outlined">credit_card</span>
</div>
</div>
</label>
</div>
<!-- Expiry and CVV -->
<div class="flex flex-wrap items-end gap-4 py-1">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">Expiry Date</p>
<input class="form-input flex w-full rounded-xl text-[#111814] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-[#dbe6e0] dark:border-gray-700 bg-white dark:bg-background-dark h-14 placeholder:text-[#618972] p-[15px] text-base font-normal" placeholder="MM/YY" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">CVV</p>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-[#111814] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-[#dbe6e0] dark:border-gray-700 bg-white dark:bg-background-dark h-14 placeholder:text-[#618972] p-[15px] text-base font-normal" placeholder="123" value=""/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#618972] cursor-help">help</span>
</div>
</label>
</div>
<!-- Save for future use Toggle -->
<div class="flex items-center justify-between py-4 px-1">
<div class="flex flex-col">
<p class="text-[#111814] dark:text-white text-base font-medium">Save for future use</p>
<p class="text-[#618972] text-xs">Your card data will be encrypted</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<!-- Footer Button -->
<div class="mt-auto p-4 mb-8">
<button class="w-full bg-primary hover:bg-primary/90 text-[#102218] font-bold text-lg py-4 rounded-xl shadow-md transition-all active:scale-[0.98]">
                Add Card
            </button>
<p class="text-center text-xs text-[#618972] mt-4 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">lock</span>
                PCI-DSS Compliant Secure Payment
            </p>
</div>
</div>
</body></html>
