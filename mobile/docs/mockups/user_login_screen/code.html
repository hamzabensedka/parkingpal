<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkingPal Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19e664",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112117",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden max-w-[480px] mx-auto bg-white dark:bg-background-dark">
<!-- Top Navigation Bar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-[#111814] dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
</div>
<h2 class="text-[#111814] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Login</h2>
</div>
<div class="flex flex-col px-4">
<!-- Header Section -->
<div class="pt-8 pb-6">
<h1 class="text-[#111814] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center">Welcome back</h1>
<p class="text-[#638870] dark:text-gray-400 text-base text-center mt-2">Find your spot in seconds</p>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-2">
<!-- Email Field -->
<div class="flex flex-wrap items-end gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111814] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dce5df] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#638870] p-[15px] text-base font-normal leading-normal" placeholder="Enter your email" type="email"/>
</label>
</div>
<!-- Password Field -->
<div class="flex flex-wrap items-end gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111814] dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111814] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dce5df] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#638870] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password"/>
<div class="text-[#638870] flex border border-[#dce5df] dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center pr-[15px] rounded-r-xl border-l-0">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
</div>
<!-- Forgot Password -->
<div class="py-2">
<p class="text-primary text-sm font-semibold leading-normal text-right underline cursor-pointer">Forgot password?</p>
</div>
<!-- Login Button -->
<div class="pt-6">
<button class="w-full bg-primary text-background-dark font-bold py-4 rounded-xl text-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
                    Log In
                </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-8">
<div class="h-[1px] flex-1 bg-[#dce5df] dark:bg-gray-700"></div>
<p class="text-[#638870] text-sm font-medium">or continue with</p>
<div class="h-[1px] flex-1 bg-[#dce5df] dark:bg-gray-700"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-4">
<button class="flex items-center justify-center gap-3 w-full border border-[#dce5df] dark:border-gray-700 bg-white dark:bg-gray-800 py-3.5 rounded-xl font-medium text-[#111814] dark:text-white active:bg-gray-50 dark:active:bg-gray-700">
<img alt="" class="w-6 h-6" data-alt="Google colorful brand logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5KQt9XSeNUeb9yJlnrFCGQF-T6aMQnKvSKVayBkdHwjnV9p0tMTVk_R10CXapt736LEhlb6y1akTqZf0LyGwTvz363ksyL_zXwxzMHnhBcrWR42VotmObS-S8GQJdedIwn7uEE2Z0LFJNjTnRMbp62_zzIg2QbNsHfF8HGDxWYerGZG8uhvkETV2-4WuH4zzfkA4-LVtlu93BxQmsrJveormLfcp0L6VuNUYvdyETYG3wWCK0uDpR6VCOYHiatjvPMkgsWyf27vaY"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-3 w-full bg-black text-white py-3.5 rounded-xl font-medium active:bg-gray-900">
<span class="material-symbols-outlined text-white">ios</span>
                    Apple
                </button>
</div>
<!-- Sign Up Link -->
<div class="mt-auto py-10">
<p class="text-[#638870] text-base text-center">
                    Don't have an account? 
                    <span class="text-primary font-bold cursor-pointer hover:underline">Sign up</span>
</p>
</div>
</div>
<!-- Bottom Home Indicator Area -->
<div class="h-8 bg-white dark:bg-background-dark"></div>
</div>
</body></html>
