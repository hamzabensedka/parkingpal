<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Mock Background (Booking Details) -->
<div class="flex-1 p-4 opacity-40">
<div class="flex items-center gap-4 mb-6">
<span class="material-symbols-outlined">arrow_back</span>
<h1 class="text-xl font-bold">Booking Details</h1>
</div>
<div class="w-full h-48 rounded-xl bg-gray-200 mb-4" data-alt="Map showing parking location" data-location="Berlin" style=""></div>
<div class="space-y-4">
<div class="h-6 bg-gray-300 rounded w-3/4"></div>
<div class="h-4 bg-gray-200 rounded w-1/2"></div>
<div class="h-4 bg-gray-200 rounded w-2/3"></div>
</div>
</div>
<!-- Bottom Sheet Overlay -->
<div class="fixed inset-0 bg-[#141414]/60 flex flex-col justify-end z-50">
<div class="flex flex-col items-stretch bg-white dark:bg-[#1c222e] rounded-t-xl overflow-hidden pb-8 max-w-md mx-auto w-full">
<!-- BottomSheetHandle -->
<button class="flex h-6 w-full items-center justify-center">
<div class="h-1.5 w-12 rounded-full bg-[#dbdfe6] dark:bg-gray-700"></div>
</button>
<!-- SectionHeader -->
<h4 class="text-[#616f89] dark:text-gray-400 text-sm font-bold leading-normal tracking-[0.015em] px-4 py-2 text-center uppercase">Cancel Booking</h4>
<!-- HeadlineText -->
<h3 class="text-[#111318] dark:text-white tracking-light text-2xl font-bold leading-tight px-6 text-center pb-2 pt-4">Are you sure you want to cancel?</h3>
<!-- Stats: Refund Amount -->
<div class="flex flex-wrap gap-4 px-6 py-4">
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-6 bg-primary/10 border border-primary/20">
<p class="text-[#111318] dark:text-white text-base font-medium leading-normal">Refund amount</p>
<p class="text-primary tracking-light text-3xl font-bold leading-tight">€15.00</p>
</div>
</div>
<!-- ActionPanel: Policy -->
<div class="px-6 py-2 @container">
<div class="flex flex-1 flex-col items-start justify-between gap-4 rounded-xl border border-[#dbdfe6] dark:border-gray-700 bg-white dark:bg-gray-800/50 p-5 @[480px]:flex-row @[480px]:items-center">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-green-600 text-sm">verified</span>
<p class="text-[#111318] dark:text-white text-base font-bold leading-tight">Flexible Policy</p>
</div>
<p class="text-[#616f89] dark:text-gray-400 text-sm font-normal leading-normal">Full refund if canceled at least 24h before arrival.</p>
</div>
<a class="text-sm font-bold leading-normal tracking-[0.015em] flex items-center gap-1 text-primary" href="#">
                            Details
                            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
</a>
</div>
</div>
<!-- Custom Reason Dropdown -->
<div class="px-6 py-4">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Reason for cancellation
<div class="relative">
<select class="w-full rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-800 p-3 pr-10 appearance-none focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-gray-800 dark:text-white">
<option>Change of plans</option>
<option>Found a better spot</option>
<option>Price is too high</option>
<option>Mistake during booking</option>
<option>Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label></div>
<!-- Footer Actions -->
<div class="flex flex-col gap-3 px-6 pt-4">
<button class="w-full py-4 px-4 bg-transparent border-2 border-red-500 text-red-600 font-bold rounded-xl hover:bg-red-50 transition-colors">
                        Confirm Cancellation
                    </button>
<button class="w-full py-4 px-4 bg-gray-100 dark:bg-gray-800 text-[#111318] dark:text-white font-bold rounded-xl">
                        Keep Booking
                    </button>
</div>
</div>
</div>
</div>
</body></html>
