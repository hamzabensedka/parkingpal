<!DOCTYPE html>

<html class="light"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center bg-transparent p-4 pb-2 justify-between">
<div class="text-[#111814] dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#111814] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Referral Program</h2>
</div>
<!-- Illustration Section -->
<div class="flex w-full grow bg-transparent @container p-4">
<div class="w-full gap-1 overflow-hidden bg-white dark:bg-[#1a2e24] @[480px]:gap-2 aspect-[4/3] rounded-xl flex items-center justify-center shadow-sm relative">
<!-- Abstract Illustration Representation -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-primary/30 opacity-50"></div>
<div class="relative z-10 flex flex-col items-center">
<div class="bg-primary p-6 rounded-full shadow-lg mb-4">
<span class="material-symbols-outlined text-background-dark text-6xl">card_giftcard</span>
</div>
<div class="flex gap-2">
<span class="material-symbols-outlined text-primary text-3xl">euro_symbol</span>
<span class="material-symbols-outlined text-primary text-3xl">euro_symbol</span>
</div>
</div>
<div class="w-full h-full bg-center bg-no-repeat bg-cover absolute inset-0 opacity-20" data-alt="Illustration of a gift box with floating euro icons" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAz_cacuj5HVvDLBR1l-pB19J76Mzk2N7wA3psBiAx0nI5mH1AYtudkFT85PdLPoouEQDXS5pWLy9gVwn_Hu1Tl8AAwM7SuNAbI-_yge-QCQ2AxhSJR6Pmto_y_3HhxFZuRrl8k6SoG6ZSGO-AwoY16hIacFY4Y0DyHrqe0hcSxxZX1mdKNl3elfR2MhReqSlMvzOg_EbJ6Qa6mIZ9oMa9oojdWUlf95A4yq9AvZc2UG6Jm5UXqaKSbD5npcYwS-d8wqZL0W6EanwJW");'></div>
</div>
</div>
<!-- Content Section -->
<div class="flex flex-col items-center px-4">
<h1 class="text-[#111814] dark:text-white tracking-tight text-[32px] font-extrabold leading-tight text-center pb-3 pt-4">Give €10, Get €10</h1>
<p class="text-[#111814] dark:text-gray-300 text-base font-normal leading-normal pb-6 pt-1 px-6 text-center">
                Invite your friends to ParkingPal and you'll both get rewards when they complete their first booking.
            </p>
<!-- Referral Code Card -->
<div class="w-full max-w-[480px] bg-white dark:bg-[#1a2e24] rounded-2xl p-6 shadow-sm border border-[#dbe6e0] dark:border-[#2a3e34] mb-8">
<p class="text-[#111814] dark:text-white text-sm font-semibold uppercase tracking-wider pb-3 text-center">Your Referral Code</p>
<div class="flex w-full items-stretch rounded-xl overflow-hidden border-2 border-dashed border-primary">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-[#111814] dark:text-white focus:outline-0 focus:ring-0 border-none bg-primary/5 dark:bg-primary/10 h-14 p-[15px] text-center text-xl font-bold tracking-widest uppercase" readonly="" value="PARKPAL123"/>
<button class="bg-primary hover:bg-primary/90 text-background-dark px-4 flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="w-full max-w-[480px] pb-10">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 px-6 rounded-xl text-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">share</span>
                    Share with Friends
                </button>
<p class="text-[#618975] dark:text-gray-400 text-xs text-center mt-4">
                    Terms &amp; Conditions apply. Rewards are added as credits to your wallet.
                </p>
</div>
</div>
<!-- Spacer for iOS home indicator -->
<div class="h-8 bg-transparent"></div>
</div>
</body></html>
