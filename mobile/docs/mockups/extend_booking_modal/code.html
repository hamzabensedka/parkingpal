<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .radio-dot-svg {
            --radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(17,24,19)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');
        }
        .dark .radio-dot-svg {
            --radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(19,236,91)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col justify-end items-center font-display">
<!-- Background Content (Mocked Active Booking Screen) -->
<div class="absolute inset-0 z-0 flex flex-col p-4 opacity-40 pointer-events-none">
<div class="flex items-center justify-between mb-6">
<span class="material-symbols-outlined text-gray-800 dark:text-white">arrow_back_ios</span>
<h2 class="text-lg font-bold text-gray-800 dark:text-white">Active Booking</h2>
<div class="w-6"></div>
</div>
<div class="bg-white dark:bg-zinc-900 rounded-xl p-6 shadow-sm mb-4 border border-zinc-200 dark:border-zinc-800">
<div class="w-full h-40 bg-zinc-100 dark:bg-zinc-800 rounded-lg mb-4 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Overhead view of an organized parking lot" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVaBn4qz9agwY07fyL5UY9Un0C6T2HOTMeegygDb-xutcuJvDvTHbgspH8U9dDGXyGOxip0Apc6_DczBseij7jDw-ezt-evK4bnI_OlSbr69FdXZnecO1YpFWPGddlN2ssKZ0XUQMG619WLjFPs1DcYewQgX4ks34MuJEQ5CgO_3hpsWAIZ-pIp_8-5cgVCokfRRwP_FUPdJ6rVTqSYLVMK_SEJZ7UWQEaNrYdBP-0behb-xPjYz3P5Q_IZMYtBSGVUCETpbY6D8MW"/>
</div>
<div class="h-4 w-3/4 bg-zinc-200 dark:bg-zinc-700 rounded mb-2"></div>
<div class="h-4 w-1/2 bg-zinc-100 dark:bg-zinc-800 rounded"></div>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-black/40 z-10"></div>
<!-- Bottom Sheet Container -->
<div class="relative z-20 w-full max-w-md bg-white dark:bg-zinc-900 rounded-t-xl shadow-2xl flex flex-col radio-dot-svg">
<!-- BottomSheetHandle -->
<div class="flex flex-col items-stretch">
<button class="flex h-6 w-full items-center justify-center pt-2">
<div class="h-1.5 w-12 rounded-full bg-zinc-200 dark:bg-zinc-700"></div>
</button>
</div>
<!-- TitleText -->
<div class="flex flex-col">
<h1 class="text-[#111813] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 text-center pb-2 pt-4">Need more time?</h1>
<p class="text-[#61896f] dark:text-zinc-400 text-sm font-normal text-center px-6">Select how much longer you'd like to stay in your current parking spot.</p>
</div>
<!-- RadioList -->
<div class="flex flex-col gap-3 p-4">
<label class="flex items-center gap-4 rounded-xl border border-solid border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/30 p-[15px] flex-row-reverse transition-colors cursor-pointer hover:bg-primary/5">
<input checked="" class="h-5 w-5 border-2 border-zinc-300 dark:border-zinc-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="extension_time" type="radio"/>
<div class="flex grow flex-col">
<p class="text-[#111813] dark:text-white text-base font-semibold leading-normal">+30 mins</p>
<p class="text-[#61896f] dark:text-primary text-sm font-medium leading-normal">+$2.50</p>
</div>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/30 p-[15px] flex-row-reverse transition-colors cursor-pointer hover:bg-primary/5">
<input class="h-5 w-5 border-2 border-zinc-300 dark:border-zinc-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="extension_time" type="radio"/>
<div class="flex grow flex-col">
<p class="text-[#111813] dark:text-white text-base font-semibold leading-normal">+1 hour</p>
<p class="text-[#61896f] dark:text-primary text-sm font-medium leading-normal">+$5.00</p>
</div>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/30 p-[15px] flex-row-reverse transition-colors cursor-pointer hover:bg-primary/5">
<input class="h-5 w-5 border-2 border-zinc-300 dark:border-zinc-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="extension_time" type="radio"/>
<div class="flex grow flex-col">
<p class="text-[#111813] dark:text-white text-base font-semibold leading-normal">+2 hours</p>
<p class="text-[#61896f] dark:text-primary text-sm font-medium leading-normal">+$9.00</p>
</div>
</label>
</div>
<!-- SingleButton (Action Area) -->
<div class="flex flex-col px-4 pb-8 pt-2">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-[#111813] text-lg font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
<span class="truncate">Confirm Extension</span>
</button>
<button class="mt-3 py-2 text-zinc-500 dark:text-zinc-400 font-medium text-sm text-center">
                Cancel
            </button>
</div>
<!-- iOS Safe Area Spacer -->
<div class="h-6 bg-white dark:bg-zinc-900"></div>
</div>
</body></html>
