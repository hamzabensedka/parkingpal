<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Success Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-white dark:bg-background-dark shadow-2xl overflow-x-hidden font-display">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-[#111813] dark:text-white flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">close</span>
</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Success</h2>
</div>
<div class="flex flex-col items-center justify-center pt-10 pb-4">
<!-- Large Success Icon -->
<div class="flex items-center justify-center size-20 rounded-full bg-primary/20 mb-4">
<span class="material-symbols-outlined text-primary text-5xl font-bold">check_circle</span>
</div>
<!-- HeadlineText -->
<h1 class="text-[#111813] dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center">Booking Confirmed!</h1>
<p class="text-[#61896f] dark:text-primary/70 text-base font-medium mt-2">Your spot is reserved and ready.</p>
</div>
<!-- Card Section -->
<div class="p-4 @container">
<div class="flex flex-col items-stretch justify-start rounded-xl @xl:flex-row @xl:items-start shadow-[0_4px_12px_rgba(0,0,0,0.08)] bg-white dark:bg-zinc-900 border border-zinc-100 dark:border-zinc-800 overflow-hidden">
<div class="w-full bg-center bg-no-repeat aspect-video bg-cover" data-alt="Modern residential driveway parking spot with clean pavement" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDRc9VO9CV2pq7h5GeGH-vWek9f8RNDkTOFeqdW440lhj_mDVFsuHMpebh-IlfjilvERB17jb8zxkC5gUeNCYHuOF8VBxMbVexNnY7JLMukWMM0D9uN6IhtmYa4uqvT48TMKeDHRdFsC5gI-ZiJ5mXCp060r1xOd3kwvfxmArr4fTqT05h7tyTz3Qy3ZKEpTUgiOCqT22UmvJfpo8882b9efbxCWSLQ31gpUwRHrgXiwJ4OOwuGvZ8BR5pn89SV7sJKOwxs-MtvJfSU");'>
</div>
<div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-1 py-5 px-5">
<p class="text-[#111813] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em]">Downtown Secure Spot</p>
<div class="flex flex-col gap-2 mt-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#61896f] text-sm">location_on</span>
<p class="text-[#61896f] dark:text-zinc-400 text-sm font-normal leading-normal">123 Market St, San Francisco, CA</p>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#61896f] text-sm">calendar_today</span>
<p class="text-[#61896f] dark:text-zinc-400 text-sm font-normal leading-normal">Today, 2:00 PM - 6:00 PM</p>
</div>
</div>
</div>
</div>
</div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Action Buttons / ButtonGroup -->
<div class="flex justify-center mt-6">
<div class="flex flex-1 gap-3 max-w-[480px] flex-col items-stretch px-4 py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-[#111813] text-base font-bold leading-normal tracking-[0.015em] w-full shadow-lg shadow-primary/20">
<span class="material-symbols-outlined mr-2">directions</span>
<span class="truncate">Get Directions</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-[#f0f4f2] dark:bg-zinc-800 text-[#111813] dark:text-white text-base font-bold leading-normal tracking-[0.015em] w-full">
<span class="truncate">View Booking Details</span>
</button>
</div>
</div>
<!-- MetaText / Footer Link -->
<div class="pb-10 pt-2 px-4 text-center">
<a class="text-[#61896f] dark:text-primary/80 text-sm font-semibold leading-normal underline decoration-primary/30 flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-lg">receipt_long</span>
                Download Receipt
            </a>
</div>
<!-- Home Indicator (iOS Style) -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1.5 bg-zinc-200 dark:bg-zinc-700 rounded-full"></div>
</div>
</div>
</body></html>
