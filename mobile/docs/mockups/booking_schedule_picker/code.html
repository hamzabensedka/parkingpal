<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Schedule Picker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 transition-colors duration-300">
<div class="relative flex min-h-screen w-full flex-col max-w-[430px] mx-auto bg-white dark:bg-background-dark shadow-2xl overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-slate-100 dark:border-slate-800">
<div class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Select Date &amp; Time</h2>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto pb-32">
<!-- CalendarPicker Section -->
<div class="p-4">
<div class="flex flex-col gap-0.5 bg-slate-50 dark:bg-slate-900/50 rounded-xl p-2 border border-slate-100 dark:border-slate-800">
<div class="flex items-center p-1 justify-between">
<button class="hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<div class="text-slate-900 dark:text-white flex size-10 items-center justify-center">
<span class="material-symbols-outlined">chevron_left</span>
</div>
</button>
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight flex-1 text-center">October 2023</p>
<button class="hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<div class="text-slate-900 dark:text-white flex size-10 items-center justify-center">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
</div>
<div class="grid grid-cols-7 gap-y-1">
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">S</p>
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">M</p>
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">T</p>
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">W</p>
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">T</p>
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">F</p>
<p class="text-slate-400 text-[13px] font-bold leading-normal tracking-tight flex h-10 w-full items-center justify-center">S</p>
<!-- Calendar Days Example -->
<div class="col-start-1 h-10"></div>
<button class="h-10 w-full text-slate-400 text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full opacity-50">28</div></button>
<button class="h-10 w-full text-slate-400 text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full opacity-50">29</div></button>
<button class="h-10 w-full text-slate-400 text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full opacity-50">30</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">1</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">2</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">3</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">4</div></button>
<button class="h-10 w-full text-white text-sm font-bold"><div class="flex size-full items-center justify-center rounded-full bg-primary shadow-sm shadow-primary/40">5</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">6</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">7</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">8</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">9</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">10</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">11</div></button>
<button class="h-10 w-full text-slate-900 dark:text-white text-sm font-medium"><div class="flex size-full items-center justify-center rounded-full">12</div></button>
</div>
</div>
</div>
<!-- Start Time SectionHeader -->
<div class="px-4 pt-4">
<h3 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight">Start Time</h3>
<p class="text-slate-500 text-sm">Select when you'll arrive</p>
</div>
<!-- Horizontal Time WheelPicker -->
<div class="px-4 py-4">
<div class="flex gap-3 overflow-x-auto no-scrollbar py-2">
<button class="flex-shrink-0 px-5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 font-semibold text-sm">
                        09:00 AM
                    </button>
<button class="flex-shrink-0 px-5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 font-semibold text-sm">
                        09:30 AM
                    </button>
<button class="flex-shrink-0 px-5 py-3 rounded-xl bg-primary text-slate-900 font-bold text-sm shadow-md shadow-primary/20">
                        10:00 AM
                    </button>
<button class="flex-shrink-0 px-5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 font-semibold text-sm">
                        10:30 AM
                    </button>
<button class="flex-shrink-0 px-5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 font-semibold text-sm">
                        11:00 AM
                    </button>
<button class="flex-shrink-0 px-5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 font-semibold text-sm">
                        11:30 AM
                    </button>
</div>
</div>
<!-- Duration SectionHeader -->
<div class="px-4 pt-4">
<h3 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight">Duration</h3>
<div class="flex justify-between items-center mt-1">
<p class="text-slate-500 text-sm">How long will you stay?</p>
<span class="text-primary font-bold">4 Hours</span>
</div>
</div>
<!-- Custom Slider (Duration Slider) -->
<div class="px-6 py-8">
<div class="relative w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full">
<div class="absolute top-0 left-0 h-full w-1/3 bg-primary rounded-full"></div>
<div class="absolute top-1/2 left-1/3 -translate-y-1/2 -translate-x-1/2 size-6 bg-white border-4 border-primary rounded-full shadow-lg"></div>
</div>
<div class="flex justify-between mt-4 px-1">
<span class="text-xs text-slate-400 font-medium">1h</span>
<span class="text-xs text-slate-400 font-medium">3h</span>
<span class="text-xs text-slate-400 font-medium">6h</span>
<span class="text-xs text-slate-400 font-medium">9h</span>
<span class="text-xs text-slate-400 font-medium">12h</span>
</div>
</div>
<!-- Spot Location Preview (Bonus for context) -->
<div class="mx-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-800 flex items-center gap-4">
<div class="size-12 rounded-lg bg-cover bg-center overflow-hidden" data-alt="Street view of a luxury parking spot" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDHs0W0kXtHIAnYcJvvYcu1LXswuqiavSmBallGNyZMGZ2JolgBHTSKS1SuEHOOv3KWZ86bVoh6OrRah1YnoYlkF_4zvQ_Am70bgvvvTwP_Spe6AhuIM36_eWIpZOIgJIIEVYFNviuBlV60TDT0YlQI2hT36gwhR_GQR29pPGHL1HyqwiQz1iO-qqpyhR-wWgTAPAHjcaAFW5FFvJodVub7Ahk8-cgQf3wFy2ms9TEr9_nf0WMmOGENMsOrE9AhJ_ruQ_OaIfuD9msl')"></div>
<div class="flex-1">
<h4 class="text-sm font-bold text-slate-900 dark:text-white">Downtown Modern Plaza</h4>
<p class="text-xs text-slate-500">240 Battery St, San Francisco</p>
</div>
<div class="text-right">
<p class="text-xs text-slate-400 line-through">$12/hr</p>
<p class="text-sm font-bold text-primary">$8/hr</p>
</div>
</div>
</div>
<!-- Live Price Preview & CTA Box -->
<div class="fixed bottom-0 w-full max-w-[430px] bg-white dark:bg-background-dark border-t border-slate-100 dark:border-slate-800 p-5 pb-8 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
<div class="flex items-center justify-between mb-4">
<div>
<p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Total Price</p>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-black text-slate-900 dark:text-white">$32.00</span>
<span class="text-xs text-slate-400 font-medium">/ 4 hours</span>
</div>
</div>
<div class="bg-primary/10 text-primary px-3 py-1.5 rounded-lg text-xs font-bold">
                Special Offer Applied
              </div>
</div>
<button class="w-full bg-primary hover:brightness-105 active:scale-[0.98] transition-all text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">event_available</span>
              Confirm Booking
            </button>
</div>
</div>
</body></html>
