<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Registration Step 1 - ParkingPal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#248479",
                        "background-light": "#f6f8f8",
                        "background-dark": "#131f1d",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full max-w-[480px] mx-auto flex-col bg-white dark:bg-[#121716] overflow-x-hidden shadow-sm">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-[#121716] p-4 pb-2 justify-between">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
<span class="material-symbols-outlined text-[#121716] dark:text-white">arrow_back_ios_new</span>
</button>
<h2 class="text-[#121716] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Sign Up</h2>
</div>
<!-- PageIndicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-4">
<div class="h-2 w-6 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-[#dde4e3] dark:bg-gray-700"></div>
</div>
<!-- HeadlineText -->
<div class="px-4">
<h1 class="text-[#121716] dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-2 pt-4">Welcome to ParkingPal</h1>
<p class="text-sm text-gray-500 dark:text-gray-400 text-center mb-6">Join our community of drivers and spot owners</p>
</div>
<!-- Registration Form -->
<div class="flex flex-col gap-1 px-4">
<!-- Full Name -->
<div class="flex flex-wrap items-end gap-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#121716] dark:text-white text-base font-medium leading-normal pb-2">Full Name</p>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-[#121716] dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-[#dde4e3] dark:border-gray-700 bg-white dark:bg-[#1a2120] h-14 placeholder:text-[#68827f] p-[15px] text-base font-normal" placeholder="Enter your full name" value=""/>
</label>
</div>
<!-- Email -->
<div class="flex flex-wrap items-end gap-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#121716] dark:text-white text-base font-medium leading-normal pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-[#121716] dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-[#dde4e3] dark:border-gray-700 bg-white dark:bg-[#1a2120] h-14 placeholder:text-[#68827f] p-[15px] text-base font-normal" placeholder="example@email.com" type="email" value=""/>
</label>
</div>
<!-- Phone Number -->
<div class="flex flex-wrap items-end gap-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#121716] dark:text-white text-base font-medium leading-normal pb-2">Phone Number</p>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-[#121716] dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-[#dde4e3] dark:border-gray-700 bg-white dark:bg-[#1a2120] h-14 placeholder:text-[#68827f] p-[15px] text-base font-normal" placeholder="+1 (555) 000-0000" type="tel" value=""/>
</label>
</div>
<!-- Password -->
<div class="flex flex-wrap items-end gap-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#121716] dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-[#121716] dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-[#dde4e3] dark:border-gray-700 bg-white dark:bg-[#1a2120] h-14 placeholder:text-[#68827f] p-[15px] text-base font-normal" placeholder="Create a password" type="password" value=""/>
<button class="absolute right-4 top-4 text-gray-400">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
</div>
</div>
<!-- Terms and Conditions Checkbox -->
<div class="flex items-start gap-3 px-6 py-4">
<input class="h-5 w-5 rounded border-[#dde4e3] text-primary focus:ring-primary mt-0.5" type="checkbox"/>
<p class="text-sm text-gray-600 dark:text-gray-400">By creating an account, you agree to our <a class="text-primary font-semibold" href="#">Terms of Service</a> and <a class="text-primary font-semibold" href="#">Privacy Policy</a>.</p>
</div>
<!-- Create Account Button -->
<div class="px-4 py-4">
<button class="flex w-full items-center justify-center rounded-xl bg-primary h-14 text-white text-lg font-bold shadow-lg shadow-primary/20">
                Create Account
            </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 px-8 py-6">
<div class="h-[1px] flex-1 bg-[#dde4e3] dark:bg-gray-700"></div>
<p class="text-sm text-gray-500 font-medium">OR CONTINUE WITH</p>
<div class="h-[1px] flex-1 bg-[#dde4e3] dark:bg-gray-700"></div>
</div>
<!-- Social Login Buttons -->
<div class="flex flex-col gap-3 px-4 pb-12">
<button class="flex w-full items-center justify-center gap-3 rounded-xl border border-[#dde4e3] dark:border-gray-700 bg-white dark:bg-[#1a2120] h-14 text-[#121716] dark:text-white font-medium">
<img alt="Google Logo" class="h-6 w-6" data-alt="Official Google icon logo for social login" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZZrgOOgQC3xShGlRBUOci9REIfzXte7yY3-mAGele34KG3BPRRRoS7XHBzAFecSYM0adhQlMgvUnWp3s82Q0nVTaLQitMcEUW8-m5lTE0WtVsfzMxCr75W0-ggHIX0EzA4TNv3e1DZaCdPSjO05h39ZwLwSsnD-8lUgpkqNF7M41T7Q5fA4CXupUejDcEMDw28FHeBoOaq_SRMOT6y409iMo2GHUVu6Btr0QsDqyDJIkNFWVwn_dLcn0lPGsE6kGZPm8jPV_cZm3t"/>
                Sign up with Google
            </button>
<button class="flex w-full items-center justify-center gap-3 rounded-xl border border-[#dde4e3] dark:border-gray-700 bg-white dark:bg-[#1a2120] h-14 text-[#121716] dark:text-white font-medium">
<span class="material-symbols-outlined text-2xl">brand_family</span>
                Sign up with Apple
            </button>
</div>
<!-- Login Link -->
<div class="text-center pb-8">
<p class="text-gray-600 dark:text-gray-400">Already have an account? <a class="text-primary font-bold" href="#">Log In</a></p>
</div>
</div>
</body></html>
