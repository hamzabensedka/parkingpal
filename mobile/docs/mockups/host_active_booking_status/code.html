</div>

<div class="flex gap-4">

</div>

<div class="flex flex-col items-stretch justify-start rounded-xl shadow-[0_0_8px_rgba(0,0,0,0.05)] bg-white dark:bg-gray-900 overflow-hidden border border-gray-100 dark:border-gray-800">

<span class="material-symbols-outlined">report_problem</span>
