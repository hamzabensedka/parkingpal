<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2bee72",
              "background-light": "#f6f8f6",
              "background-dark": "#102217",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-[#111813] dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Verification</h2>
</div>
<!-- HeadlineText -->
<div class="px-4">
<h1 class="text-[#111813] dark:text-white tracking-light text-[32px] font-bold leading-tight text-left pb-3 pt-6">Verify your identity</h1>
<p class="text-[#111813] dark:text-gray-300 text-base font-normal leading-normal pb-3 pt-1">To ensure safety in our marketplace, please upload a clear photo of your official ID.</p>
</div>
<!-- Illustration Section (Image with Overlay) -->
<div class="flex w-full grow bg-transparent @container p-4">
<div class="w-full gap-1 overflow-hidden bg-white dark:bg-zinc-800/50 @[480px]:gap-2 aspect-[4/3] rounded-xl flex items-center justify-center relative border border-dashed border-gray-300 dark:border-zinc-700">
<div class="flex flex-col items-center gap-4">
<div class="flex items-center justify-center size-24 bg-primary/20 rounded-full">
<span class="material-symbols-outlined text-primary text-5xl">photo_camera</span>
</div>
<div class="flex gap-2">
<span class="material-symbols-outlined text-gray-400 text-6xl">badge</span>
<span class="material-symbols-outlined text-gray-400 text-6xl">menu_book</span>
</div>
</div>
<!-- Background pattern decorative -->
<div class="absolute inset-0 opacity-5 pointer-events-none bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary via-transparent to-transparent"></div>
</div>
</div>
<!-- TitleText -->
<div class="px-4">
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] text-left pb-2 pt-4">Upload a photo of your Driver's License or Passport</h2>
<p class="text-sm text-gray-500 dark:text-gray-400">Make sure all details are visible and there is no glare.</p>
</div>
<!-- Action Buttons -->
<div class="p-4 flex flex-col gap-3 mt-auto mb-4">
<button class="w-full h-14 bg-primary rounded-xl flex items-center justify-center gap-2 text-[#102217] font-bold text-lg active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">add_a_photo</span>
                Take Photo
            </button>
<button class="w-full h-14 bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-xl flex items-center justify-center gap-2 text-[#111813] dark:text-white font-semibold text-lg active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">file_upload</span>
                Upload from Gallery
            </button>
<button class="w-full h-12 flex items-center justify-center text-gray-500 dark:text-gray-400 font-medium text-base hover:text-[#111813] dark:hover:text-white mt-2">
                Skip for now
            </button>
</div>
<!-- Home Indicator -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1 bg-gray-300 dark:bg-zinc-700 rounded-full"></div>
</div>
</div>
</body></html>
