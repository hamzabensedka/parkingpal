<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Incoming Booking Request</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0077b8",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1c23",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col bg-white dark:bg-background-dark max-w-md mx-auto overflow-x-hidden shadow-2xl">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between border-b dark:border-gray-800">
<div class="text-[#101618] dark:text-white flex size-12 shrink-0 items-center justify-start" data-icon="close">
<span class="material-symbols-outlined cursor-pointer">close</span>
</div>
<h2 class="text-[#101618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12 font-display">Booking Request</h2>
</div>
<div class="flex-1 flex flex-col overflow-y-auto">
<!-- ProfileHeader -->
<div class="flex p-4 @container pt-8">
<div class="flex w-full flex-col gap-4 items-center">
<div class="flex gap-4 flex-col items-center">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-4 border-primary/10" data-alt="Professional portrait of a male renter smiling" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD8RplalZiRcHu4cTjatdinvyF2hWUHHnly2bYXrFvp0COkrsDS7nssoGMjrv1vBxLteYoOA3bl_JuxCo6CtTIckkupYSEGvYQzrOrWzWA7cTq_8mCFOAeGYHfPg1p4xDZAmInK1a19S3Fa1brRiuHglbxtd3dfWatzBBkktOlCdlses7syO91g_-Mo6XMACdyCGHS4UVQFCeZ0xocKl1cPJuI2XxV_Hdy-MzFkX6ztjDTmzTUSwXXdw5HivktNu9XSxbOoZFtfB2VM");'>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-[#101618] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] text-center font-display">James R.</p>
<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-yellow-500 text-sm">star</span>
<p class="text-[#5e7c8d] dark:text-gray-400 text-base font-normal leading-normal text-center font-display">4.9 rating</p>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-primary text-sm">verified</span>
<p class="text-[#5e7c8d] dark:text-gray-400 text-base font-normal leading-normal text-center font-display">Verified Renter</p>
</div>
</div>
</div>
</div>
</div>
<!-- Card -->
<div class="px-4 py-2">
<div class="flex items-stretch justify-between gap-4 rounded-xl bg-[#f0f3f5] dark:bg-gray-800/50 p-4 border border-gray-100 dark:border-gray-800">
<div class="flex flex-col gap-1 flex-[2_2_0px] justify-center">
<p class="text-[#5e7c8d] dark:text-gray-400 text-xs font-semibold uppercase tracking-wider">Spot Location</p>
<p class="text-[#101618] dark:text-white text-lg font-bold leading-tight font-display">Garage Le Marais</p>
<p class="text-[#5e7c8d] dark:text-gray-400 text-sm font-normal leading-normal font-display">Today, 3:00 PM - 6:00 PM (3h)</p>
</div>
<div class="w-full bg-center bg-no-repeat aspect-square bg-cover rounded-xl flex-1 max-w-[80px]" data-alt="Modern indoor garage entrance with clean concrete" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD1R-5NANNkKitajK2HcaUbQNfLgtO6hmkXe9E7EOQLa91QbZ7VgHhyk5VkjtUkWOeEYLDdnxrQN0TTaM5Rvfemw-OSTHtCJkoY-GeLgZr0Epj4gLshTmvzs-UpQN1FOB8L6UpOVtbc3RI5pVF3dYOJoQfNjJEU1uqBswOiqJrmfDpgz7_wy2gljZBXYUoTRuiLidGsW5iHUPIJP9cLkgr3GLXkGdaADFNXwK1qJXJzcilA24StXJE8K7PrtbfB_v0MMOXlwYZTqjng");'>
</div>
</div>
</div>
<!-- Stats -->
<div class="flex flex-wrap gap-4 p-4">
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-6 bg-primary/10 dark:bg-primary/20 border border-primary/20">
<p class="text-primary dark:text-primary text-sm font-bold uppercase tracking-wider leading-normal font-display">Estimated Earnings</p>
<div class="flex items-baseline gap-1">
<p class="text-[#101618] dark:text-white tracking-light text-3xl font-bold leading-tight font-display">€12.00</p>
<p class="text-[#5e7c8d] dark:text-gray-400 text-sm font-normal">total</p>
</div>
</div>
</div>
<!-- MetaText -->
<div class="px-4 pb-4">
<div class="flex items-center justify-center gap-2 py-3 px-4 border border-gray-200 dark:border-gray-800 rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-primary text-sm">chat_bubble</span>
<p class="text-primary text-sm font-semibold leading-normal font-display">Message James</p>
</div>
</div>
</div>
<!-- Sticky Action Buttons -->
<div class="p-4 flex flex-col gap-3 bg-white dark:bg-background-dark border-t dark:border-gray-800">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all font-display">
                Accept Booking
            </button>
<button class="w-full bg-[#f0f3f5] dark:bg-gray-800 text-[#5e7c8d] dark:text-gray-300 font-bold py-4 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-all font-display">
                Decline
            </button>
</div>
<div class="h-6 bg-white dark:bg-background-dark"></div>
</div>
</body></html>
