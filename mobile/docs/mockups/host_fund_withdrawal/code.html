<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Host Fund Withdrawal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom styles to hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111813] dark:text-white antialiased">
<div class="relative flex flex-col min-h-screen w-full max-w-md mx-auto bg-white dark:bg-background-dark shadow-xl overflow-hidden group/design-root">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between bg-white dark:bg-background-dark sticky top-0 z-10">
<div class="text-[#111813] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/5 transition-colors cursor-pointer">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Withdraw Funds</h2>
</div>
<!-- Balance Section -->
<div class="flex flex-col items-center justify-center pt-8 pb-6 bg-white dark:bg-background-dark">
<p class="text-[#61896f] dark:text-gray-400 text-sm font-medium leading-normal text-center">Available to withdraw</p>
<h1 class="text-[#111813] dark:text-white tracking-tight text-[40px] font-bold leading-tight mt-2 text-center">€124.00</h1>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col px-4 pt-4 pb-6 space-y-6">
<!-- Amount Input -->
<div class="flex flex-col gap-2">
<label class="flex flex-col">
<p class="text-[#111813] dark:text-gray-200 text-base font-medium leading-normal pb-2">Amount to withdraw</p>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#111813] dark:text-white font-semibold text-lg pointer-events-none">€</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111813] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe6df] dark:border-gray-700 bg-white dark:bg-[#1a2e22] focus:border-primary h-16 pl-10 pr-4 text-xl font-semibold placeholder:text-[#61896f] dark:placeholder:text-gray-500 transition-all" placeholder="0.00" type="number" value="124.00"/>
</div>
</label>
<div class="flex justify-between px-1">
<span class="text-xs text-[#61896f] dark:text-gray-500">No transfer fee</span>
<button class="text-xs font-semibold text-primary hover:text-[#0fb845] transition-colors">Withdraw all</button>
</div>
</div>
<!-- Divider -->
<div class="h-px w-full bg-[#f0f4f2] dark:bg-gray-800"></div>
<!-- Payout Method -->
<div class="flex flex-col gap-3">
<p class="text-[#111813] dark:text-gray-200 text-base font-medium leading-normal">Payout method</p>
<div class="flex items-center gap-4 p-4 rounded-xl border border-[#dbe6df] dark:border-gray-700 bg-white dark:bg-[#1a2e22] shadow-sm">
<div class="h-10 w-14 shrink-0 rounded bg-gray-100 dark:bg-white/10 flex items-center justify-center overflow-hidden relative">
<div class="absolute inset-0 bg-blue-900/10 dark:bg-white/5" data-alt="Bank logo background pattern"></div>
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300 relative z-10">account_balance</span>
</div>
<div class="flex flex-col justify-center flex-1 min-w-0">
<p class="text-[#111813] dark:text-white text-base font-semibold leading-normal truncate">KBC Bank Ireland</p>
<p class="text-[#61896f] dark:text-gray-400 text-sm font-normal leading-normal truncate">IBAN •••• 1002</p>
</div>
<div class="shrink-0">
<button class="flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-8 px-3 bg-[#f0f4f2] dark:bg-white/10 text-[#111813] dark:text-white text-sm font-medium leading-normal hover:bg-gray-200 dark:hover:bg-white/20 transition-colors">
<span class="truncate">Change</span>
</button>
</div>
</div>
</div>
<!-- Info Box -->
<div class="flex gap-3 items-start p-3 rounded-lg bg-blue-50/50 dark:bg-blue-900/10 border border-blue-100 dark:border-blue-900/30">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400 text-[20px] shrink-0 mt-0.5">schedule</span>
<div class="flex flex-col">
<p class="text-sm text-blue-900 dark:text-blue-100 font-medium">Estimated arrival</p>
<p class="text-sm text-blue-700 dark:text-blue-300/80 leading-snug">
                        Funds typically arrive in <span class="font-semibold">2-3 business days</span>.
                    </p>
</div>
</div>
</div>
<!-- Bottom Action Area -->
<div class="mt-auto p-4 pb-8 bg-white dark:bg-background-dark border-t border-transparent dark:border-gray-800">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-[#0fb845] text-[#102216] text-lg font-bold leading-normal tracking-[0.015em] transition-all active:scale-[0.98] shadow-sm shadow-green-500/20">
<span class="truncate">Withdraw €124.00</span>
</button>
</div>
</div>
</body></html>
