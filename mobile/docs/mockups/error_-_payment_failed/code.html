<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Error - ParkingPal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
              "error": "#ef4444",
              "success": "#22c55e",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-gray-900 dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
</div>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Payment Error</h2>
</div>
<!-- Main Content (EmptyState Variant) -->
<div class="flex-1 flex flex-col justify-center px-6 py-6">
<div class="flex flex-col items-center gap-8">
<!-- Warning Icon / Illustration -->
<div class="relative flex items-center justify-center w-24 h-24 rounded-full bg-error/10">
<span class="material-symbols-outlined text-error text-6xl">error</span>
</div>
<div class="flex flex-col items-center gap-3">
<p class="text-gray-900 dark:text-white text-2xl font-bold leading-tight tracking-[-0.015em] text-center">Payment Failed</p>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-relaxed max-w-[320px] text-center">
                    Your transaction could not be processed due to insufficient funds or an expired card. Please check your details and try again.
                </p>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-[480px] flex flex-col gap-3 mt-4">
<!-- Retry Payment (Primary Green as requested) -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-success text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-success/20">
<span class="truncate">Retry Payment</span>
</button>
<!-- Change Payment Method -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Change Payment Method</span>
</button>
</div>
</div>
</div>
<!-- BottomNavBar -->
<div class="flex gap-2 border-t border-gray-200 dark:border-gray-800 bg-background-light dark:bg-background-dark px-4 pb-8 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">search</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Find</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-900 dark:text-white" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">calendar_today</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Bookings</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">payments</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Earnings</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-gray-400 dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</div>
</div>
</body></html>
