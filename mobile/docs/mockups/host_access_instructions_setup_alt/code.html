<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Host Access Instructions Setup</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;family=Noto+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #dbe0e6;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #343a46;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-white overflow-x-hidden antialiased">
<div class="relative flex h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden">
<!-- Top Navigation -->
<div class="flex items-center px-4 py-3 justify-between shrink-0 bg-background-light dark:bg-background-dark z-20">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-[#111418] dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Access Instructions</h2>
</div>
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-2 shrink-0">
<div class="h-1.5 w-1.5 rounded-full bg-[#dbe0e6] dark:bg-gray-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-[#dbe0e6] dark:bg-gray-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-[#dbe0e6] dark:bg-gray-700"></div>
<div class="h-1.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-1.5 w-1.5 rounded-full bg-[#dbe0e6] dark:bg-gray-700"></div>
</div>
<!-- Main Content Scroll Area -->
<div class="flex-1 overflow-y-auto pb-24">
<!-- Headline -->
<h2 class="text-[#111418] dark:text-white tracking-tight text-2xl font-bold leading-tight px-5 pt-4 pb-6">How will drivers access the spot?</h2>
<!-- Selection Grid -->
<div class="grid grid-cols-2 gap-3 px-5 mb-8">
<!-- Option 1 -->
<label class="cursor-pointer group relative flex flex-col gap-3 rounded-xl border-2 border-transparent bg-white dark:bg-[#1C252E] p-4 shadow-sm hover:shadow-md hover:border-primary/30 has-[:checked]:border-primary has-[:checked]:bg-primary/5 dark:has-[:checked]:bg-primary/10 transition-all duration-200">
<input class="peer sr-only" name="access_method" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">handshake</span>
</div>
<div>
<p class="text-[#111418] dark:text-white text-[15px] font-semibold leading-tight">Meet in person</p>
<p class="text-[#617589] dark:text-gray-400 text-xs font-normal leading-normal mt-1">Hand over keys</p>
</div>
<!-- Checkmark Icon -->
<div class="absolute top-3 right-3 text-primary opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-[20px] filled">check_circle</span>
</div>
</label>
<!-- Option 2 -->
<label class="cursor-pointer group relative flex flex-col gap-3 rounded-xl border-2 border-transparent bg-white dark:bg-[#1C252E] p-4 shadow-sm hover:shadow-md hover:border-primary/30 has-[:checked]:border-primary has-[:checked]:bg-primary/5 dark:has-[:checked]:bg-primary/10 transition-all duration-200">
<input class="peer sr-only" name="access_method" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">key</span>
</div>
<div>
<p class="text-[#111418] dark:text-white text-[15px] font-semibold leading-tight">Lockbox code</p>
<p class="text-[#617589] dark:text-gray-400 text-xs font-normal leading-normal mt-1">Code for box</p>
</div>
<div class="absolute top-3 right-3 text-primary opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-[20px] filled">check_circle</span>
</div>
</label>
<!-- Option 3 (Selected) -->
<label class="cursor-pointer group relative flex flex-col gap-3 rounded-xl border-2 border-transparent bg-white dark:bg-[#1C252E] p-4 shadow-sm hover:shadow-md hover:border-primary/30 has-[:checked]:border-primary has-[:checked]:bg-primary/5 dark:has-[:checked]:bg-primary/10 transition-all duration-200">
<input checked="" class="peer sr-only" name="access_method" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">phonelink_lock</span>
</div>
<div>
<p class="text-[#111418] dark:text-white text-[15px] font-semibold leading-tight">Smart lock</p>
<p class="text-[#617589] dark:text-gray-400 text-xs font-normal leading-normal mt-1">App or keypad</p>
</div>
<div class="absolute top-3 right-3 text-primary opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-[20px] filled">check_circle</span>
</div>
</label>
<!-- Option 4 -->
<label class="cursor-pointer group relative flex flex-col gap-3 rounded-xl border-2 border-transparent bg-white dark:bg-[#1C252E] p-4 shadow-sm hover:shadow-md hover:border-primary/30 has-[:checked]:border-primary has-[:checked]:bg-primary/5 dark:has-[:checked]:bg-primary/10 transition-all duration-200">
<input class="peer sr-only" name="access_method" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">pin</span>
</div>
<div>
<p class="text-[#111418] dark:text-white text-[15px] font-semibold leading-tight">Gate code</p>
<p class="text-[#617589] dark:text-gray-400 text-xs font-normal leading-normal mt-1">Keypad entry</p>
</div>
<div class="absolute top-3 right-3 text-primary opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-[20px] filled">check_circle</span>
</div>
</label>
<!-- Option 5 -->
<label class="cursor-pointer group relative flex flex-col gap-3 rounded-xl border-2 border-transparent bg-white dark:bg-[#1C252E] p-4 shadow-sm hover:shadow-md hover:border-primary/30 has-[:checked]:border-primary has-[:checked]:bg-primary/5 dark:has-[:checked]:bg-primary/10 transition-all duration-200">
<input class="peer sr-only" name="access_method" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">lock_open_right</span>
</div>
<div>
<p class="text-[#111418] dark:text-white text-[15px] font-semibold leading-tight">Trust</p>
<p class="text-[#617589] dark:text-gray-400 text-xs font-normal leading-normal mt-1">Open access</p>
</div>
<div class="absolute top-3 right-3 text-primary opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">
<span class="material-symbols-outlined text-[20px] filled">check_circle</span>
</div>
</label>
</div>
<!-- Instructions Text Area -->
<div class="px-5">
<label class="flex flex-col w-full group">
<p class="text-[#111418] dark:text-white text-base font-semibold leading-normal pb-3 pl-1">Provide detailed instructions</p>
<div class="relative">
<textarea class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-[#1C252E] placeholder:text-[#617589] dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal min-h-[140px] transition-shadow shadow-sm" placeholder="E.g. The gate code is 1234. Please park in spot #42 on the second level..."></textarea>
</div>
<p class="text-xs text-[#617589] dark:text-gray-500 mt-2 pl-1">These instructions will only be shared with drivers after booking.</p>
</label>
</div>
</div>
<!-- Fixed Footer -->
<div class="absolute bottom-0 left-0 right-0 p-5 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-t border-[#dbe0e6] dark:border-gray-800 z-10">
<button class="w-full rounded-xl bg-primary h-12 text-white font-bold text-base hover:bg-blue-600 active:scale-[0.98] transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
            Next step
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</body></html>
