<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Submit Your Review</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark sticky top-0 z-10 backdrop-blur-md bg-opacity-90 dark:bg-opacity-90">
<div class="w-16"></div> <!-- Spacer for centering title -->
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] text-center">Write a Review</h2>
<div class="flex w-16 items-center justify-end">
<button class="text-primary text-base font-semibold leading-normal tracking-[0.015em] shrink-0 hover:opacity-80 transition-opacity">Cancel</button>
</div>
</div>
<!-- Main Content Scrollable Area -->
<div class="flex-1 flex flex-col items-center px-4 pb-24">
<!-- Headline -->
<div class="w-full max-w-md pt-6 pb-2">
<h2 class="text-[#111418] dark:text-white tracking-tight text-[28px] font-bold leading-tight text-center">How was your experience?</h2>
<p class="text-[#617589] dark:text-gray-400 text-center text-sm mt-2">Rate your parking spot at <span class="font-medium text-[#111418] dark:text-gray-200">Downtown Garage A</span></p>
</div>
<!-- Reaction Bar (Stars) -->
<div class="w-full max-w-md py-6">
<div class="flex justify-center gap-2 sm:gap-4">
<!-- Star 1 -->
<button class="group p-2 focus:outline-none">
<span class="material-symbols-outlined text-[40px] text-[#dbe0e6] group-hover:text-primary transition-colors fill-1" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;">star</span>
</button>
<!-- Star 2 -->
<button class="group p-2 focus:outline-none">
<span class="material-symbols-outlined text-[40px] text-[#dbe0e6] group-hover:text-primary transition-colors fill-1" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;">star</span>
</button>
<!-- Star 3 -->
<button class="group p-2 focus:outline-none">
<span class="material-symbols-outlined text-[40px] text-[#dbe0e6] group-hover:text-primary transition-colors fill-1" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;">star</span>
</button>
<!-- Star 4 -->
<button class="group p-2 focus:outline-none">
<span class="material-symbols-outlined text-[40px] text-[#dbe0e6] group-hover:text-primary transition-colors fill-1" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;">star</span>
</button>
<!-- Star 5 -->
<button class="group p-2 focus:outline-none">
<span class="material-symbols-outlined text-[40px] text-[#dbe0e6] group-hover:text-primary transition-colors fill-1" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 40;">star</span>
</button>
</div>
</div>
<div class="w-full max-w-md h-px bg-[#e6e8eb] dark:bg-gray-800 my-2"></div>
<!-- Chips (Quick Feedback) -->
<div class="w-full max-w-md py-4">
<p class="text-[#111418] dark:text-white text-base font-semibold leading-normal mb-3 pl-1">What stood out?</p>
<div class="flex gap-3 flex-wrap">
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f2f4] dark:bg-gray-800 border border-transparent hover:border-primary/30 hover:bg-primary/5 active:bg-primary/10 transition-all px-4 group">
<span class="material-symbols-outlined text-[18px] text-[#111418] dark:text-white group-hover:text-primary">check_circle</span>
<p class="text-[#111418] dark:text-white text-sm font-medium leading-normal group-hover:text-primary">Easy access</p>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f2f4] dark:bg-gray-800 border border-transparent hover:border-primary/30 hover:bg-primary/5 active:bg-primary/10 transition-all px-4 group">
<span class="material-symbols-outlined text-[18px] text-[#111418] dark:text-white group-hover:text-primary">savings</span>
<p class="text-[#111418] dark:text-white text-sm font-medium leading-normal group-hover:text-primary">Great value</p>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f2f4] dark:bg-gray-800 border border-transparent hover:border-primary/30 hover:bg-primary/5 active:bg-primary/10 transition-all px-4 group">
<span class="material-symbols-outlined text-[18px] text-[#111418] dark:text-white group-hover:text-primary">cleaning_services</span>
<p class="text-[#111418] dark:text-white text-sm font-medium leading-normal group-hover:text-primary">Clean</p>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f2f4] dark:bg-gray-800 border border-transparent hover:border-primary/30 hover:bg-primary/5 active:bg-primary/10 transition-all px-4 group">
<span class="material-symbols-outlined text-[18px] text-[#111418] dark:text-white group-hover:text-primary">security</span>
<p class="text-[#111418] dark:text-white text-sm font-medium leading-normal group-hover:text-primary">Secure</p>
</button>
</div>
</div>
<!-- TextField -->
<div class="w-full max-w-md py-2 mt-2">
<p class="text-[#111418] dark:text-white text-base font-semibold leading-normal mb-3 pl-1">Additional comments</p>
<label class="flex flex-col w-full">
<textarea class="form-input flex w-full resize-none rounded-xl text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe0e6] dark:border-gray-700 bg-white dark:bg-[#1a2632] focus:border-primary min-h-[140px] placeholder:text-[#617589] dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal transition-shadow" placeholder="Share more details about your parking experience..."></textarea>
</label>
</div>
</div>
<!-- Sticky Bottom Button -->
<div class="fixed bottom-0 left-0 w-full bg-white/80 dark:bg-background-dark/80 backdrop-blur-xl border-t border-[#e6e8eb] dark:border-gray-800 p-4 pb-8 z-20">
<div class="w-full max-w-md mx-auto">
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-6 py-3.5 transition-transform active:scale-[0.98]">
<p class="text-white text-base font-bold leading-normal">Submit Review</p>
</button>
</div>
</div>
</div>
</body></html>
