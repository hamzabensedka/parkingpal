<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkingPal - User Selection</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2c61e8",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111521",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center w-full">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-xl mx-auto">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-20">
<button class="text-[#111318] dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-[#111318] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">ParkingPal</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col px-4 pb-24 overflow-y-auto">
<!-- HeadlineText -->
<h1 class="text-[#111318] dark:text-white tracking-tight text-[32px] font-bold leading-tight px-2 text-center pb-8 pt-4">How will you use ParkingPal?</h1>
<!-- Cards Container -->
<div class="flex flex-col gap-4 w-full">
<!-- Card 1: Driver -->
<label class="group relative cursor-pointer w-full">
<input checked="" class="peer sr-only" name="user_type" type="radio" value="driver"/>
<div class="flex flex-col items-center p-6 rounded-lg bg-white dark:bg-gray-800 shadow-[0_2px_8px_rgba(0,0,0,0.08)] dark:shadow-none border-2 border-transparent peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary/20 transition-all duration-300">
<!-- Icon Placeholder (Replacing Image) -->
<div class="h-20 w-20 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center mb-4 text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[40px]">directions_car</span>
</div>
<div class="flex flex-col items-center gap-2 text-center">
<p class="text-[#111318] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">I need parking</p>
<p class="text-[#636d88] dark:text-gray-400 text-base font-normal leading-normal">Find a spot near your destination</p>
</div>
<!-- Checkmark Indicator -->
<div class="absolute top-4 right-4 text-primary opacity-0 peer-checked:opacity-100 transition-all duration-300 transform scale-50 peer-checked:scale-100">
<span class="material-symbols-outlined filled">check_circle</span>
</div>
</div>
</label>
<!-- Card 2: Owner -->
<label class="group relative cursor-pointer w-full">
<input class="peer sr-only" name="user_type" type="radio" value="owner"/>
<div class="flex flex-col items-center p-6 rounded-lg bg-white dark:bg-gray-800 shadow-[0_2px_8px_rgba(0,0,0,0.08)] dark:shadow-none border-2 border-transparent peer-checked:border-[#10b981] peer-checked:ring-1 peer-checked:ring-[#10b981]/20 transition-all duration-300">
<!-- Icon Placeholder (Replacing Image) -->
<div class="h-20 w-20 rounded-full bg-emerald-50 dark:bg-emerald-900/20 flex items-center justify-center mb-4 text-[#10b981] group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[40px]">euro_symbol</span>
</div>
<div class="flex flex-col items-center gap-2 text-center">
<p class="text-[#111318] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">I have a spot to rent</p>
<p class="text-[#636d88] dark:text-gray-400 text-base font-normal leading-normal">Earn money by renting your space</p>
</div>
<!-- Checkmark Indicator -->
<div class="absolute top-4 right-4 text-[#10b981] opacity-0 peer-checked:opacity-100 transition-all duration-300 transform scale-50 peer-checked:scale-100">
<span class="material-symbols-outlined filled">check_circle</span>
</div>
</div>
</label>
</div>
</div>
<!-- SingleButton Fixed Bottom -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-30 flex justify-center">
<div class="w-full max-w-md">
<button class="w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 bg-primary hover:bg-blue-700 text-white text-base font-bold leading-normal tracking-[0.015em] transition-all active:scale-[0.98] shadow-lg shadow-blue-500/30">
<span class="truncate">Continue</span>
</button>
</div>
</div>
</div>
</body></html>
