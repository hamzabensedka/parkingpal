<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Booking Issue</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#181111] dark:text-white overflow-x-hidden antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col">
<!-- Top App Bar -->
<div class="sticky top-0 z-20 flex items-center bg-background-light dark:bg-background-dark p-4 justify-between border-b border-transparent dark:border-[#3a2020]">
<button aria-label="Go back" class="text-[#181111] dark:text-white flex size-12 shrink-0 items-center justify-start focus:outline-none active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-[#181111] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] text-center">Report an Issue</h2>
<div class="size-12 shrink-0"></div> <!-- Spacer for balance -->
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 flex flex-col px-4 pb-32 max-w-lg mx-auto w-full">
<!-- Headline -->
<h2 class="text-[#181111] dark:text-white tracking-tight text-[28px] font-bold leading-tight text-left py-5">
                What seems to be the problem?
            </h2>
<!-- Radio List Options -->
<div class="flex flex-col gap-3" style="--radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(242,13,13)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');">
<!-- Option 1: Spot Occupied -->
<label class="group relative flex items-center gap-4 rounded-xl border border-solid border-[#e6dbdb] dark:border-[#3a2020] bg-white dark:bg-[#2a1616] p-4 transition-all hover:border-primary/50 dark:hover:border-primary/50 cursor-pointer shadow-sm">
<input checked="" class="peer h-6 w-6 shrink-0 border-2 border-[#d0c4c4] dark:border-[#5a3a3a] bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="issue_type" type="radio"/>
<div class="flex items-center justify-center size-10 rounded-full bg-[#fcf2f2] dark:bg-[#381a1a] text-primary shrink-0">
<span class="material-symbols-outlined">directions_car</span>
</div>
<div class="flex grow flex-col">
<p class="text-[#181111] dark:text-white text-base font-medium leading-normal">Spot occupied</p>
<p class="text-[#8a6060] dark:text-[#b08b8b] text-xs font-normal">Another vehicle is parked here</p>
</div>
</label>
<!-- Option 2: Wrong Code -->
<label class="group relative flex items-center gap-4 rounded-xl border border-solid border-[#e6dbdb] dark:border-[#3a2020] bg-white dark:bg-[#2a1616] p-4 transition-all hover:border-primary/50 dark:hover:border-primary/50 cursor-pointer shadow-sm">
<input class="peer h-6 w-6 shrink-0 border-2 border-[#d0c4c4] dark:border-[#5a3a3a] bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="issue_type" type="radio"/>
<div class="flex items-center justify-center size-10 rounded-full bg-[#fcf2f2] dark:bg-[#381a1a] text-primary shrink-0">
<span class="material-symbols-outlined">offline_pin_off</span>
</div>
<div class="flex grow flex-col">
<p class="text-[#181111] dark:text-white text-base font-medium leading-normal">Cannot access</p>
<p class="text-[#8a6060] dark:text-[#b08b8b] text-xs font-normal">Code or key doesn't work</p>
</div>
</label>
<!-- Option 3: Safety -->
<label class="group relative flex items-center gap-4 rounded-xl border border-solid border-[#e6dbdb] dark:border-[#3a2020] bg-white dark:bg-[#2a1616] p-4 transition-all hover:border-primary/50 dark:hover:border-primary/50 cursor-pointer shadow-sm">
<input class="peer h-6 w-6 shrink-0 border-2 border-[#d0c4c4] dark:border-[#5a3a3a] bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="issue_type" type="radio"/>
<div class="flex items-center justify-center size-10 rounded-full bg-[#fcf2f2] dark:bg-[#381a1a] text-primary shrink-0">
<span class="material-symbols-outlined">security</span>
</div>
<div class="flex grow flex-col">
<p class="text-[#181111] dark:text-white text-base font-medium leading-normal">Safety concern</p>
</div>
</label>
<!-- Option 4: Damage -->
<label class="group relative flex items-center gap-4 rounded-xl border border-solid border-[#e6dbdb] dark:border-[#3a2020] bg-white dark:bg-[#2a1616] p-4 transition-all hover:border-primary/50 dark:hover:border-primary/50 cursor-pointer shadow-sm">
<input class="peer h-6 w-6 shrink-0 border-2 border-[#d0c4c4] dark:border-[#5a3a3a] bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="issue_type" type="radio"/>
<div class="flex items-center justify-center size-10 rounded-full bg-[#fcf2f2] dark:bg-[#381a1a] text-primary shrink-0">
<span class="material-symbols-outlined">broken_image</span>
</div>
<div class="flex grow flex-col">
<p class="text-[#181111] dark:text-white text-base font-medium leading-normal">Damage to property</p>
</div>
</label>
<!-- Option 5: Other -->
<label class="group relative flex items-center gap-4 rounded-xl border border-solid border-[#e6dbdb] dark:border-[#3a2020] bg-white dark:bg-[#2a1616] p-4 transition-all hover:border-primary/50 dark:hover:border-primary/50 cursor-pointer shadow-sm">
<input class="peer h-6 w-6 shrink-0 border-2 border-[#d0c4c4] dark:border-[#5a3a3a] bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:ring-0 focus:ring-offset-0 checked:focus:border-primary" name="issue_type" type="radio"/>
<div class="flex items-center justify-center size-10 rounded-full bg-[#fcf2f2] dark:bg-[#381a1a] text-primary shrink-0">
<span class="material-symbols-outlined">help_center</span>
</div>
<div class="flex grow flex-col">
<p class="text-[#181111] dark:text-white text-base font-medium leading-normal">Other issue</p>
</div>
</label>
</div>
<!-- Additional Details Text Area -->
<div class="mt-8 flex flex-col">
<p class="text-[#181111] dark:text-white text-base font-bold leading-normal pb-3">Additional Details</p>
<textarea class="form-input flex w-full min-w-0 resize-none rounded-xl text-[#181111] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e6dbdb] dark:border-[#3a2020] bg-white dark:bg-[#2a1616] focus:border-primary min-h-32 placeholder:text-[#8a6060] dark:placeholder:text-[#6a4a4a] p-4 text-base font-normal leading-normal transition-all" placeholder="Please describe the issue in more detail to help us resolve it quickly..."></textarea>
</div>
<!-- Upload Photo Action -->
<div class="mt-6">
<button class="w-full flex items-center gap-4 bg-white dark:bg-[#2a1616] p-4 rounded-xl border border-[#e6dbdb] dark:border-[#3a2020] active:bg-[#f5f0f0] dark:active:bg-[#382020] transition-colors group">
<div class="flex items-center justify-center rounded-lg bg-[#fcf2f2] dark:bg-[#381a1a] text-primary shrink-0 size-12 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<div class="flex flex-col items-start flex-1">
<p class="text-[#181111] dark:text-white text-base font-medium leading-normal">Upload Photo</p>
<p class="text-[#8a6060] dark:text-[#b08b8b] text-sm text-left">Helpful for verification</p>
</div>
<div class="shrink-0 text-[#8a6060] dark:text-[#6a4a4a]">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
</div>
</div>
<!-- Sticky Bottom Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-white/90 dark:bg-[#1a0c0c]/90 backdrop-blur-md border-t border-[#e6dbdb] dark:border-[#3a2020] z-30">
<div class="max-w-lg mx-auto w-full">
<button class="w-full rounded-xl bg-primary h-14 text-white text-base font-bold shadow-lg shadow-primary/30 active:scale-[0.98] transition-all hover:bg-primary/90 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">report_problem</span>
                    Report Issue
                </button>
</div>
</div>
</div>
</body></html>
