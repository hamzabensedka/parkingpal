<!DOCTYPE html>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df259",
                        "background-light": "#f5f8f6",
                        "background-dark": "#102216",

        }

<title>Referral Rewards</title>

</div>

</div>
<div class="flex flex-col flex-1 px-4">

<div class="@container">
<div class="py-3">

<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
</div>
</div>
</div>
<!-- HeadlineText -->
<h1 class="text-[#111813] dark:text-white tracking-tight text-[32px] font-extrabold leading-tight text-center pb-3 pt-6">Give €10, Get €10</h1>
<!-- BodyText -->
<p class="text-[#111813]/70 dark:text-white/70 text-base font-medium leading-relaxed pb-8 pt-1 px-4 text-center">
                Share the love of easy parking with your friends and you both get rewards to use on your next spot.
            </p>

<div class="flex flex-col items-center justify-center bg-white dark:bg-white/5 rounded-xl p-6 border border-gray-100 dark:border-white/10 shadow-sm mb-8">

<h4 class="text-primary text-xs font-bold leading-normal tracking-[0.1em] pb-3 text-center uppercase">Your Referral Code</h4>
<div class="flex items-center justify-between w-full bg-background-light dark:bg-white/10 rounded-lg p-4 border-2 border-dashed border-primary/30">
<span class="text-2xl font-black tracking-widest text-[#111813] dark:text-white">PARKPAL123</span>
<button class="bg-primary text-[#102216] p-2 rounded flex items-center justify-center">
<span class="material-symbols-outlined text-sm">content_copy</span>

</div>
</div>

</div>
<div class="flex flex-col items-center text-center">

</div>

</div>
</div>

<button class="w-full bg-primary hover:bg-primary/90 text-[#102216] font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all">
<span class="material-symbols-outlined">share</span>
