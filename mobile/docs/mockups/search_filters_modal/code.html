<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkingPal Filters</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2c61e8",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111521",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a1f2e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom range slider styling for cross-browser consistency if needed, 
           but using the provided div-based slider structure for visual fidelity */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white overflow-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between px-4 py-3 bg-surface-light dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800 z-10 sticky top-0">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-gray-900 dark:text-white" style="font-size: 24px;">close</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight text-center flex-1">Filters</h2>
<button class="text-sm font-medium text-primary hover:text-primary/80 transition-colors px-2">
                Reset
            </button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto hide-scrollbar pb-24">
<!-- Date & Time Section -->
<div class="bg-surface-light dark:bg-surface-dark mt-2 p-4 pb-6">
<h3 class="text-xl font-bold leading-tight tracking-tight mb-4 text-gray-900 dark:text-white">Date &amp; Time</h3>
<!-- Calendar Component -->
<div class="flex flex-col gap-4">
<!-- Month Navigation -->
<div class="flex items-center justify-between px-2">
<button class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
<span class="material-symbols-outlined text-gray-900 dark:text-white" style="font-size: 20px;">chevron_left</span>
</button>
<p class="text-base font-bold text-gray-900 dark:text-white">October 2023</p>
<button class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
<span class="material-symbols-outlined text-gray-900 dark:text-white" style="font-size: 20px;">chevron_right</span>
</button>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-y-2">
<!-- Days Header -->
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">S</div>
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">M</div>
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">T</div>
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">W</div>
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">T</div>
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">F</div>
<div class="text-center text-xs font-semibold text-gray-400 dark:text-gray-500 py-2">S</div>
<!-- Days -->
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white col-start-4">1</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">2</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">3</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">4</button>
<!-- Selected Range Start -->
<div class="h-10 w-full flex items-center justify-center relative">
<div class="absolute inset-y-0 right-0 w-1/2 bg-primary/10 dark:bg-primary/20"></div>
<div class="relative z-10 flex size-10 items-center justify-center rounded-full bg-primary text-white text-sm font-bold shadow-sm">5</div>
</div>
<!-- Selected Range Middle -->
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">6</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">7</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">8</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">9</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">10</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">11</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">12</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">13</div>
<div class="h-10 w-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">14</div>
<!-- Selected Range End -->
<div class="h-10 w-full flex items-center justify-center relative">
<div class="absolute inset-y-0 left-0 w-1/2 bg-primary/10 dark:bg-primary/20"></div>
<div class="relative z-10 flex size-10 items-center justify-center rounded-full bg-primary text-white text-sm font-bold shadow-sm">15</div>
</div>
<!-- Remaining Days -->
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">16</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">17</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">18</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">19</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">20</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">21</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">22</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">23</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">24</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">25</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">26</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">27</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">28</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">29</button>
<button class="h-10 w-full flex items-center justify-center text-sm font-medium text-gray-900 dark:text-white">30</button>
</div>
</div>
</div>
<!-- Price Range Section -->
<div class="bg-surface-light dark:bg-surface-dark mt-2 p-4">
<h3 class="text-xl font-bold leading-tight tracking-tight mb-6 text-gray-900 dark:text-white">Price Range (Hourly)</h3>
<div class="px-2">
<div class="flex justify-between items-center mb-4">
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Min</span>
<p class="text-lg font-bold text-gray-900 dark:text-white">€2 - €15</p>
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Max</span>
</div>
<div class="relative h-12 w-full flex items-center">
<!-- Track Background -->
<div class="absolute h-1.5 w-full rounded-full bg-gray-200 dark:bg-gray-700"></div>
<!-- Active Track -->
<div class="absolute h-1.5 rounded-full bg-primary left-[10%] right-[30%]"></div>
<!-- Left Handle -->
<div class="absolute left-[10%] top-1/2 -translate-y-1/2 -translate-x-1/2 group cursor-pointer">
<div class="size-7 rounded-full bg-white dark:bg-gray-800 border-2 border-primary shadow-md flex items-center justify-center">
<div class="size-2 rounded-full bg-primary"></div>
</div>
<div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity">€2</div>
</div>
<!-- Right Handle -->
<div class="absolute right-[30%] top-1/2 -translate-y-1/2 translate-x-1/2 group cursor-pointer">
<div class="size-7 rounded-full bg-white dark:bg-gray-800 border-2 border-primary shadow-md flex items-center justify-center">
<div class="size-2 rounded-full bg-primary"></div>
</div>
<div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity">€15</div>
</div>
</div>
<div class="flex justify-between text-xs font-medium text-gray-400 dark:text-gray-500 mt-[-10px]">
<span>€0</span>
<span>€10</span>
<span>€20</span>
<span>€30+</span>
</div>
</div>
</div>
<!-- Distance Section -->
<div class="bg-surface-light dark:bg-surface-dark mt-2 p-4">
<h3 class="text-xl font-bold leading-tight tracking-tight mb-4 text-gray-900 dark:text-white">Distance</h3>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="distance" type="radio"/>
<div class="px-4 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-300 transition-all peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary dark:peer-checked:bg-primary/20 dark:peer-checked:text-primary hover:border-primary/50">
                            Within 1 km
                        </div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="distance" type="radio"/>
<div class="px-4 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-300 transition-all peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary dark:peer-checked:bg-primary/20 dark:peer-checked:text-primary hover:border-primary/50">
                            Within 3 km
                        </div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="distance" type="radio"/>
<div class="px-4 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-300 transition-all peer-checked:border-primary peer-checked:bg-primary/10 peer-checked:text-primary dark:peer-checked:bg-primary/20 dark:peer-checked:text-primary hover:border-primary/50">
                            Any
                        </div>
</label>
</div>
</div>
<!-- Amenities Section -->
<div class="bg-surface-light dark:bg-surface-dark mt-2 p-4 mb-8">
<h3 class="text-xl font-bold leading-tight tracking-tight mb-4 text-gray-900 dark:text-white">Amenities</h3>
<div class="space-y-4">
<!-- EV Charging -->
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400">
<span class="material-symbols-outlined">ev_station</span>
</div>
<span class="text-base font-medium text-gray-900 dark:text-white">EV Charging</span>
</div>
<div class="relative flex items-center">
<input checked="" class="peer h-6 w-6 cursor-pointer rounded border-gray-300 text-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:checked:bg-primary" type="checkbox"/>
</div>
</label>
<!-- Security -->
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400">
<span class="material-symbols-outlined">videocam</span>
</div>
<span class="text-base font-medium text-gray-900 dark:text-white">Security / CCTV</span>
</div>
<div class="relative flex items-center">
<input class="peer h-6 w-6 cursor-pointer rounded border-gray-300 text-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:checked:bg-primary" type="checkbox"/>
</div>
</label>
<!-- Covered Parking -->
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400">
<span class="material-symbols-outlined">roofing</span>
</div>
<span class="text-base font-medium text-gray-900 dark:text-white">Covered</span>
</div>
<div class="relative flex items-center">
<input class="peer h-6 w-6 cursor-pointer rounded border-gray-300 text-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:checked:bg-primary" type="checkbox"/>
</div>
</label>
<!-- Handicap -->
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-full bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400">
<span class="material-symbols-outlined">accessible</span>
</div>
<span class="text-base font-medium text-gray-900 dark:text-white">Handicap Accessible</span>
</div>
<div class="relative flex items-center">
<input class="peer h-6 w-6 cursor-pointer rounded border-gray-300 text-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:checked:bg-primary" type="checkbox"/>
</div>
</label>
</div>
</div>
</div>
<!-- Sticky Bottom Footer -->
<div class="absolute bottom-0 w-full bg-surface-light dark:bg-surface-dark border-t border-gray-200 dark:border-gray-800 p-4">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white rounded-xl font-bold text-base shadow-lg transition-transform active:scale-[0.99] flex items-center justify-center gap-2">
                Show 18 Results
            </button>
</div>
</div>
</body></html>
